voice:
  record_key: ctrl+b
  max_recording_seconds: 120
  auto_tts: true
  # Desktop: relay speech through `hermes serve` instead of calling the gateway
  # from the app. Client-direct plays sentence by sentence with no lookahead
  # (voice-playback.ts pump: synthesize → play → synthesize), so every sentence
  # boundary is a full gateway round trip of silence. The relay WS schedules
  # PCM back-to-back and prefetches on the server. STT relays too.
  client_direct: false
  beep_enabled: true
  silence_threshold: 200
  silence_duration: 3
  # Read-aloud of a finished reply longer than this speaks a one-sentence
  # gateway summary ("Todo erstellt …") instead of the whole text. Live voice
  # conversation is unaffected (text arrives incrementally there). Served by
  # patches/serve-speak-summary.patch; 0 = off. Break-even: direct read costs
  # 1.4 s + ~15 chars/s, the summary ~4.5 s to first sound + one ~4 s sentence,
  # so anything past ~110 chars is quicker AND shorter as a summary.
  speak_summary_min_chars: 120
