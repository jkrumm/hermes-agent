  # delegation.max_iterations: hermes_cli/goals.py rejects non-positive values outright
  # (`if max_turns < 1: max_turns = DEFAULT_MAX_TURNS`) and GoalManager falls back on falsy 0 too
  # (`int(default_max_turns or DEFAULT_MAX_TURNS)`), so 0 means "use the 20-turn default", not
  # unlimited. Set to sys.maxsize so goal mode has no turn limit either (owner rule, settled
  # 2026-09-12).
  max_turns: 9223372036854775807
skills:
