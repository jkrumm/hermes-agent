agent:
  # 0 = unlimited (resolve_turn_limit's documented sentinel: null/"none"/"unlimited"/-1/0 all
  # mean unbounded). Agent workers have no turn limit (owner rule, settled 2026-09-12, see
  # ~/.claude/rules/agent-limits.md) — the only liveness rule left is the idle watchdog below
  # (gateway_timeout), never a turn count.
  max_turns: 0
  # Gateway INACTIVITY timeout (seconds) — the idle watchdog: fires only when the agent is
  # completely idle (no tool calls, no API responses in flight), never a wall-clock cap on an
  # active turn. This is the ONE liveness rule agent workers still have (2026-09-12 policy).
  # 0 = unlimited/disabled.
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  environment_hint: ''
  verify_on_stop: false
  # Inactivity warning (seconds), once per run before gateway_timeout fires; notify-only, never
  # kills the turn itself. 0 = off.
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  reasoning_effort: high
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  # Default per-shell-command timeout (seconds) for the terminal tool — a guard on one command
  # invocation, not a bound on the agent's turn/iteration count or wall-clock life. Out of scope
  # for the no-turn-limit policy (owner rule, settled 2026-09-12); a caller can still override it
  # per call.
  timeout: 180
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
