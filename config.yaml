    # Why not gpt-5.6-luna: approval_smart.py hardcodes temperature=0 at the call
    # site and gpt-5.x refuses any non-default temperature, so every risky command
    # paid a 503 + retry plus a high-effort reasoning turn. Why the /anthropic leg
