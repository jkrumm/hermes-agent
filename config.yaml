  inherit_mcp_toolsets: true
  # Per-subagent iteration cap. NOT resolve_turn_limit'd like agent.max_turns — this value flows
  # raw (tools/delegate_tool.py -> agent/agent_init.py) into IterationBudget's `used >= max_total`
  # comparison with no unbounded sentinel, so 0 here means ZERO iterations allowed, not unlimited.
  # Set to sys.maxsize (the same value init_agent() defaults to when max_iterations is omitted
  # entirely) so subagents have no turn limit either (owner rule, settled 2026-09-12).
  max_iterations: 9223372036854775807
  # 0 = no cap, upstream's default since they found a fixed timeout killed
  # legitimate heavy work mid-task. Our 600 was a copy of the OLD default and
  # is a hard kill for a `high`-effort child.
  child_timeout_seconds: 0
  reasoning_effort: ''
  max_concurrent_children: 10
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false
prefill_messages_file: ''
goals:
