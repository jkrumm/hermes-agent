# How the factory ships this project.
apiVersion: factory/v2
name: hermes-agent
deploy:
  mode: make # `make deploy` applies the checkout (setup + gateway/serve restart); `make verify` probes the live gateway
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 5m
ship:
  - { via: push }
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
hygiene:
  # Weekly hygiene probes (the factory's `hygiene` loop): `make <target>`, exit 0 is clean,
  # anything else is one finding. Both are read-only; the lead that takes a finding runs /hermes-update and make deploy.
  probes:
    - { name: upstream, target: upstream-check } # installed Hermes vs the newest stable upstream tag
    - { name: live, target: verify } # live gateway, API server, inference gateway token, serve auth gate, patches
